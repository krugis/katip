# ==============================================================================
# Kâtip master configuration — the single file for all non-secret settings.
#
# Everything the bootstrap renders or runs (compose, Traefik routes, LiteLLM,
# LibreChat, the governance DB seed) derives from this file + infra/env/katip.env
# (secrets). Secrets are auto-generated once by `pnpm dev:up` and NEVER overwritten.
#
# `pnpm dev:up` validates this file and rejects unknown settings. After an edit,
# re-run it: it detects the change and re-applies. To change project.name or remove
# a tenant, run `pnpm dev:rollback` first, because the old stack is not renamed. It
# deletes everything, and asks for more than a yes if real data may exist.
#
# Licence: AGPL-3.0-only (this repo, see LICENSE)
# ==============================================================================

project:
  # Docker Compose project and network prefix; the tenant project is <name>-<slug>.
  name: katip
  # Services get <service>.<base_domain>; tenant demo → demo.localhost
  base_domain: localhost
  # On any other domain, a model with no provider key stops the install, because the mock
  # only echoes. Set this to true to allow it, such as for a test site using a local model.
  # allow_mock_models: false
  # Each tenant gets its own /24 under this, so a host can run many: Docker's
  # default address pools allow only about 30 networks.
  tenant_network_prefix: 10.77

# ------------------------------------------------------------------------------
# Identity (LLD-02). Keycloak is configured from here by the bootstrap's identity
# step. Locales: login pages use the default unless the user picks another.
# ------------------------------------------------------------------------------
identity:
  realm: katip
  default_locale: tr
  locales: [tr, en]

# ------------------------------------------------------------------------------
# Daily job (P1-65): approved deletions, purges and retention. Off by default, so
# set up nothing on this machine you didn't ask for. Until it's on, run
# pnpm tenant:daily yourself. To turn it on, uncomment these and run pnpm dev:up,
# which adds one line to this user's crontab (host-local time).
# ------------------------------------------------------------------------------
# jobs:
#   daily_at: '03:30'

# ------------------------------------------------------------------------------
# Deploys (P1-71). `pnpm dev:deploy` keeps this many copies of the databases in
# .katip/backups/, and the images tagged with them. They sit on this disk: they are
# a way back from a bad deploy, not the off-site backup of P1-42. Default 5.
# ------------------------------------------------------------------------------
# deploy:
#   keep_backups: 5

# ------------------------------------------------------------------------------
# Image pins. Never use :latest (CLAUDE.md §7).
# ------------------------------------------------------------------------------
images:
  traefik: traefik:v3.7.17
  postgres: pgvector/pgvector:0.8.7-pg16-trixie
  keycloak: quay.io/keycloak/keycloak:26.8.1
  mongodb: mongo:7.0.16
  meilisearch: getmeili/meilisearch:v1.56.0
  valkey: valkey/valkey:8.0.12
  mailpit: axllent/mailpit:v1.33.0
  # v0.8.0+ fills user and body placeholders in custom endpoint headers (P1-05).
  librechat: ghcr.io/danny-avila/librechat:v0.8.7
  # File search (P1-08). MIT. A newer build needs a newer LibreChat first: its upstream says
  # so, as LibreChat v0.8.7 doesn't say whose file it's deleting. Runs one per tenant.
  rag_api: ghcr.io/danny-avila/librechat-rag-api-dev-lite:v0.9.0
  # Used by the bootstrap's own network checks.
  curl: curlimages/curl:8.8.0
  # Billing (P1-36): Lago, unmodified, AGPL-3.0. Its API, worker and clock run from this image.
  lago_api: getlago/api:v1.55.0
  # Lago's own Postgres 15, with the pg_partman extension its migrations need (image MIT;
  # PostgreSQL and pg_partman under the PostgreSQL licence). Pinned by digest too, because Lago
  # rebuilt this tag in January 2026. Its Redis is our Valkey image, as a separate container.
  lago_postgres: getlago/postgres-partman:15.0-alpine@sha256:27a1e3a1138a69b5a0911ce125dfa613b9ced07604a2d781b9d31141f7f96036
  # Presidio analyzer (P1-11): upstream moved to GHCR (LLD-01 still says MCR).
  # Self-built from infra/presidio/Dockerfile on top of this base, plus the spaCy
  # model wheel; sha256 = wheel checksum from the spacy-models GitHub release.
  presidio_analyzer:
    registry: ghcr.io/data-privacy-stack/presidio-analyzer
    version: '2.2.366'
    spacy_model_version: '3.8.0'
    spacy_model_sha256: 6f3c4b853852ea9e9d2dc76cc950dddb10a7e4c42d813308caefe6c5e8be2f0a
    # Finds names (P1-13). MIT; fixed to one commit of its Hugging Face repository.
    ner_model: akdeniz27/bert-base-turkish-cased-ner
    ner_model_revision: 99995f7d2be4b3a28c74f0d36ee97f8c04ee0571
  # Self-built from infra/litellm/Dockerfile; sha256 = wheel checksum from PyPI.
  litellm:
    version: '1.79.3'
    sha256: 16314049d109e5cadb2abdccaf2e07ea03d2caa3a9b3f54f34b5b825092b4eeb

# ------------------------------------------------------------------------------
# Model catalog: feeds both LiteLLM and the governance DB (model_catalog).
# A model uses its real provider once api_key_env is set in infra/env/katip.env;
# without it, the model routes to mock-llm. litellm_params go to LiteLLM as they
# are. Prices are micro-USD per 1M tokens. Model ids marked (verify) must be
# checked against the provider before pilot. Router rules live in packages/db
# (seed); the seed fails if a rule names a model missing here.
#
# self_hosted: true says the model runs on the operator's own servers, so nothing sent to it
# leaves them. An embedding model marked so gets personal data unmasked (LLD-03 §5); chat
# masking doesn't change. Leave it out if unsure: absent means outside, so masked. It needs
# litellm_params.api_base and the model's key, or the marker doesn't reach the catalog. No
# model here is marked: emb-bge-m3 goes to DeepInfra, and tr-gpt-oss-120b is a chat model
# whose host (vllm-tr) isn't described anywhere as the operator's own.
# ------------------------------------------------------------------------------
models:
  - alias: std-deepseek-v4-flash
    display_name: DeepSeek V4 Flash
    class: standard
    provider: deepinfra
    region: global
    data_policy: zero_retention
    price_in: 90000
    price_out: 180000
    api_key_env: DEEPINFRA_API_KEY
    litellm_params:
      model: deepinfra/deepseek-ai/DeepSeek-V4-Flash # (verify)
      api_key: os.environ/DEEPINFRA_API_KEY
  - alias: std-glm-5.3-flash
    display_name: GLM-5.3 Flash
    class: standard
    provider: z-ai
    region: global
    data_policy: zero_retention
    price_in: 84000
    price_out: 280000
    api_key_env: OPENROUTER_API_KEY
    litellm_params:
      model: openrouter/z-ai/glm-5.3-flash # OpenRouter account must deny training providers
      api_key: os.environ/OPENROUTER_API_KEY
  - alias: std-gemma-4-26b
    display_name: Gemma 4 26B
    class: standard
    provider: deepinfra
    region: global
    data_policy: zero_retention
    price_in: 70000
    price_out: 340000
    api_key_env: DEEPINFRA_API_KEY
    litellm_params:
      model: deepinfra/google/gemma-4-26b-a4b-it # (verify)
      api_key: os.environ/DEEPINFRA_API_KEY
  - alias: prem-claude-sonnet-5.5
    display_name: Claude Sonnet 5.5
    class: premium
    provider: anthropic
    region: global
    data_policy: retention_30d
    price_in: 2000000
    price_out: 10000000
    api_key_env: ANTHROPIC_API_KEY
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - alias: prem-gemini-4-argon
    display_name: Gemini 4 Argon
    class: premium
    provider: vertex_ai
    region: eu
    data_policy: zero_retention
    price_in: 2000000
    price_out: 10000000
    api_key_env: GCP_VERTEX_KEY
    litellm_params:
      model: vertex_ai/gemini-4-argon # (verify)
      vertex_project: os.environ/GCP_PROJECT
      vertex_location: europe-west3
  - alias: tr-gpt-oss-120b
    display_name: gpt-oss-120b (Türkiye)
    class: tr
    provider: vllm-tr
    region: tr
    data_policy: zero_retention
    price_in: 150000
    price_out: 600000
    api_key_env: VLLM_TR_KEY
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: http://vllm-tr:8000/v1
      api_key: os.environ/VLLM_TR_KEY
  - alias: emb-bge-m3
    display_name: BGE-M3 embeddings
    class: embedding
    provider: deepinfra
    region: global
    data_policy: zero_retention
    price_in: 10000
    price_out: 0
    api_key_env: DEEPINFRA_API_KEY
    litellm_params:
      model: deepinfra/BAAI/bge-m3 # (verify)
      api_key: os.environ/DEEPINFRA_API_KEY

# ------------------------------------------------------------------------------
# Billing (LLD-06, P1-36/P1-37). Lago runs on every install, for the provider only. Seat prices
# come from the governance plans table (DESIGN §5, seeded by packages/db): the monthly plan's
# price, which is the annual one + 20%. Only the monthly plan is set up in Lago: how an annual
# plan is invoiced, and the other open questions, are in docs/lld/06-usage-billing.md §8.
# Setup creates Lago's catalog once and then only checks it: changing a price here doesn't
# change Lago, it stops the install with the difference (docs/runbooks/billing.md).
# ------------------------------------------------------------------------------
billing:
  # micro-USD per 1M overage tokens (LLD-06 §2), billed pro rata per token.
  overage:
    standard: 1000000
    premium: 6000000
  # Seats are invoiced at the start of the month (true) or at its end. A seat added mid-month
  # is charged for the rest of it; one removed isn't refunded, and goes from the next month.
  seats_in_advance: true
  # An hour's usage goes to Lago this many minutes after the hour ends. Usage arriving later
  # still goes, as a further event for that hour, as long as it's within lookback_days.
  grace_minutes: 10
  lookback_days: 35

# ------------------------------------------------------------------------------
# Monitoring (P1-43, LLD-10 §5): Prometheus, Alertmanager, Grafana, Loki, Fluent Bit and
# exporters, for the provider only. About 354 MiB of memory idle (docs/lld/10 §5). Grafana is on
# http://127.0.0.1:3000 (user katip-admin, password GRAFANA_ADMIN_PASSWORD in katip.env) and
# Prometheus on http://127.0.0.1:9090: this machine only, never through Traefik.
# Set enabled: false to leave it out; its data volumes are kept until pnpm dev:rollback.
# ------------------------------------------------------------------------------
monitoring:
  enabled: true
  # Prometheus keeps numbers this long. At least 8: the budget anomaly alert compares a day
  # with the 7 before it.
  metrics_retention_days: 15
  # Loki keeps our services' logs this long. They hold people's ids (never names or text), and
  # nothing deletes one person's lines sooner, so keep it short (LLD-10 §8).
  logs_retention_days: 7
  # Every alert is emailed here through Mailpit, and goes nowhere else: Alertmanager's mail server
  # is fixed to Mailpit. A real channel (Telegram, phone, real email) is the owner's choice, in
  # infra/monitoring/alertmanager/alertmanager.tmpl.yml, and empty until then.
  alert_email: alerts@localhost
  # Grafana and Loki are AGPL-3.0 and run unmodified; the rest are Apache-2.0, redis_exporter MIT.
  images:
    prometheus: prom/prometheus:v3.5.0
    alertmanager: prom/alertmanager:v0.28.1
    grafana: grafana/grafana:12.1.1
    loki: grafana/loki:3.5.3
    fluent_bit: fluent/fluent-bit:4.0.3
    node_exporter: prom/node-exporter:v1.9.1
    cadvisor: gcr.io/cadvisor/cadvisor:v0.52.1
    blackbox_exporter: prom/blackbox-exporter:v0.27.0
    postgres_exporter: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    mongodb_exporter: percona/mongodb_exporter:0.44.0
    valkey_exporter: oliver006/redis_exporter:v1.74.0

# ------------------------------------------------------------------------------
# Tenants (rendered by the bootstrap; the provisioner CLI lands in P1-21). Each one
# gets its own LibreChat, Meilisearch, Mongo user and secrets (LLD-07). Dev runs two,
# so isolation between tenants is tested on every install. dev:up creates these through
# the provisioner; `pnpm tenant:create` adds more, which don't need to be listed here.
# Secrets are generated into infra/env/tenants/<slug>.secrets.env.
# ------------------------------------------------------------------------------
tenants:
  - slug: demo
    name: Demo A.Ş.
    # The first tenant admin, invited by email: see Mailpit in dev.
    admin_email: owner@demo.localhost
    plan: business
    seats: 10
    kvkk_addon: false
    limits:
      standard: 68000000
      premium: 2000000
    pii:
      mode: mask
      # When the name detector (Presidio) fails: allow (send with structured masking
      # only) or block (reject the request). See LLD-03 §5.
      on_detector_failure: allow
  - slug: acme
    name: Acme Ltd.
    admin_email: owner@acme.localhost
    plan: starter
    seats: 5
    kvkk_addon: false
    limits:
      standard: 10000000
      premium: 500000
    pii:
      mode: mask
      on_detector_failure: allow
