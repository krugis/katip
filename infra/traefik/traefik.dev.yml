# Traefik static configuration — DEV profile (used by infra/compose/dev.yml).
# TLS uses locally generated *.localhost certificates (infra/traefik/dev-certs/,
# generated by scripts/setup.mjs). Dashboard: http://127.0.0.1:9090 (host).

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ':443'
    http:
      tls: {} # certificates come from dynamic/dev-certs.yml (SNI match)
  traefik:
    address: ':8080'

providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false
    # Network: set per container with the traefik.docker.network label.
  # Each company's IP allowlist. No files to write, and no route opens if this fails.
  http:
    endpoint: http://console-api:8081/internal/traefik
    pollInterval: 5s
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: true
  insecure: true # dev only: dashboard on the traefik entrypoint (127.0.0.1:9090 on the host)

ping: {}

log:
  level: INFO

accessLog: {}

metrics:
  prometheus: true
