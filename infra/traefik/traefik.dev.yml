# Traefik static configuration — DEV profile (used by infra/compose/dev.yml).
# TLS uses locally generated *.localhost certificates (infra/traefik/dev-certs/,
# generated by scripts/setup.mjs). The dashboard's API is for inside the container only:
#   docker exec katip-traefik-1 wget -qO- http://127.0.0.1:8080/api/http/routers

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ':443'
    http:
      tls: {} # certificates come from dynamic/dev-certs.yml (SNI match)
  # Traefik's own: its API lists every company's host and allowlist. Traefik is on each
  # company's network, and an address with no host would listen there too.
  traefik:
    address: '127.0.0.1:8080'

providers:
  # Each company's route and IP allowlist, active companies only. No Docker, and no files to
  # write. It keeps the last good answer if console-api goes away; with none, the company's
  # host answers 404. Platform routes don't depend on it: they're in dynamic/routes.yml.
  http:
    endpoint: http://console-api:8081/internal/traefik
    pollInterval: 5s
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: true
  insecure: true # dev only: on the traefik entrypoint, so inside the container only

ping: {}

log:
  level: INFO

accessLog: {}

metrics:
  prometheus: true
