# Traefik static configuration — DEV profile (used by infra/compose/dev.yml).
# TLS uses locally generated *.localhost certificates (infra/traefik/dev-certs/,
# generated by scripts/setup.mjs). Dashboard: http://127.0.0.1:8080 (host).

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ':443'
    http:
      tls: {} # certificates come from dynamic/dev-certs.yml (SNI match)
  traefik:
    address: ':8080'

providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false
    network: sme-platform_edge
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: true
  insecure: true # dev only: dashboard on the traefik entrypoint (127.0.0.1:8080)

ping: {}

log:
  level: INFO

accessLog: {}

metrics:
  prometheus: true
