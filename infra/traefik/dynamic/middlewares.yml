# Dynamic middlewares referenced by routers (LLD-01 §2.2). Each company's IP allowlist
# comes from console-api, over Traefik's HTTP provider (LLD-02 §6).

http:
  middlewares:
    secure-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true

    ratelimit-user:
      rateLimit:
        average: 120
        burst: 240

    dashboard-auth:
      basicAuth:
        users: []
