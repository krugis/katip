# Traefik static configuration (LLD-01 §2). Dev profile: TLS with locally
# generated *.localhost certificates, dashboard on 127.0.0.1:8080.
# Rendered values are injected by scripts/setup.mjs from katip.config.yaml.

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ':443'
    http:
      tls: {}

providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false
    network: sme-platform_edge
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: true
  insecure: false

ping:
  entryPoint: websecure
  manualRouting: true

log:
  level: INFO

accessLog: {}

metrics:
  prometheus: true
