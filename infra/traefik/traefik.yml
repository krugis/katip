# Traefik static configuration (LLD-01 §2). Dev profile: TLS with locally
# generated *.localhost certificates, dashboard on 127.0.0.1:8080.
# Rendered values are injected by scripts/setup.mjs from katip.config.yaml.

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ':443'
    http:
      tls: {}
  # Traefik's own: metrics name every company. Traefik is on each company's network, and an
  # address with no host would listen there too.
  traefik:
    address: '127.0.0.1:8080'

providers:
  # Each company's route and IP allowlist, active companies only. No Docker, and no files to
  # write. It keeps the last good answer if console-api goes away; with none, the company's
  # host answers 404. Platform routes don't depend on it: they're in dynamic/routes.yml.
  http:
    endpoint: http://console-api:8081/internal/traefik
    pollInterval: 5s
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: true
  insecure: false

ping:
  entryPoint: websecure
  manualRouting: true

log:
  level: INFO

accessLog: {}

metrics:
  prometheus: true
