# Per-tenant compose template (LLD-01 §2.2, LLD-07). Rendered by the bootstrap
# (dev) or provisioner (dev/test/pilot) to infra/compose/tenants/<slug>.yml
# with project name <project>-<slug>.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # One per tenant: LibreChat's index names are fixed, and its sync deletes documents
  # missing from its own Mongo database, so a shared instance would lose other
  # tenants' search data.
  meili-${KATIP_SLUG}:
    image: ${KATIP_IMAGE_MEILISEARCH}
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: 'true'
      MEILI_ENV: development
    env_file:
      - ../../env/tenants/${KATIP_SLUG}.meili.env
    volumes:
      - meili-${KATIP_SLUG}:/meili_data
    networks:
      - tenant
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:7700/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

  # One per tenant, like search: the RAG API holds one JWT secret, and in this version a
  # valid token can list and read every file it holds (LLD-08 §1).
  ragdb-${KATIP_SLUG}:
    image: ${KATIP_IMAGE_POSTGRES}
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=20
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=128MB
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
    env_file:
      - ../../env/tenants/${KATIP_SLUG}.ragdb.env
    volumes:
      - ragdb-${KATIP_SLUG}:/var/lib/postgresql/data
    networks:
      - tenant
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag -d rag']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

  rag-${KATIP_SLUG}:
    image: ${KATIP_IMAGE_RAG_API}
    restart: unless-stopped
    depends_on:
      ragdb-${KATIP_SLUG}:
        condition: service_healthy
    env_file:
      - ../../env/tenants/${KATIP_SLUG}.rag.env
    networks:
      - tenant
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: '1.0'
    healthcheck:
      # Reads the reply: when its database is down, this version still answers 200.
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request as u;assert json.load(u.urlopen('http://127.0.0.1:8000/health'))['status']=='UP'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  lc-${KATIP_SLUG}:
    image: ${KATIP_IMAGE_LIBRECHAT}
    restart: unless-stopped
    # LibreChat looks up the OIDC issuer once at startup and never retries, so after
    # a restart login would stay broken if Keycloak came up later. Wait for it first.
    command:
      - sh
      - -c
      - |
        until node -e 'fetch(process.env.OPENID_ISSUER + "/.well-known/openid-configuration").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'; do sleep 3; done
        exec npm run backend
    depends_on:
      meili-${KATIP_SLUG}:
        condition: service_healthy
      rag-${KATIP_SLUG}:
        condition: service_healthy
    env_file:
      - ../../env/tenants/${KATIP_SLUG}.env
    volumes:
      - ../../librechat/rendered/${KATIP_SLUG}.librechat.yaml:/app/librechat.yaml:ro
      - lc-uploads-${KATIP_SLUG}:/app/uploads
      - ../../traefik/dev-certs/localhost.crt:/certs/dev-ca.crt:ro
    networks:
      - tenant
    deploy:
      resources:
        limits:
          memory: ${KATIP_TENANT_MEMORY:-1g}
          cpus: '${KATIP_TENANT_CPUS:-1.0}'
    logging: *default-logging

volumes:
  lc-uploads-${KATIP_SLUG}: {}
  meili-${KATIP_SLUG}: {}
  ragdb-${KATIP_SLUG}: {}

networks:
  # Only this tenant's services, plus Traefik, the gateway and Mongo (LLD-01 §2.3).
  # Not internal: users can add MCP tools, which need the internet.
  tenant:
    name: ${KATIP_COMPOSE_PROJECT}_t_${KATIP_SLUG}
    external: true
