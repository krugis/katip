# Per-tenant compose template (LLD-01 §2.2, LLD-07). Rendered by the bootstrap
# (dev) or provisioner (dev/test/pilot) to infra/compose/tenants/<slug>.yml
# with project name <project>-<slug>.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # One per tenant: LibreChat's index names are fixed, and its sync deletes documents
  # missing from its own Mongo database, so a shared instance would lose other
  # tenants' search data.
  meili-${KATIP_SLUG}:
    image: ${KATIP_IMAGE_MEILISEARCH}
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: 'true'
      MEILI_ENV: development
    env_file:
      - ../../env/tenants/${KATIP_SLUG}.meili.env
    volumes:
      - meili-${KATIP_SLUG}:/meili_data
    networks:
      - tenant
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:7700/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

  lc-${KATIP_SLUG}:
    image: ${KATIP_IMAGE_LIBRECHAT}
    restart: unless-stopped
    # LibreChat looks up the OIDC issuer once at startup and never retries, so after
    # a restart login would stay broken if Keycloak came up later. Wait for it first.
    command:
      - sh
      - -c
      - |
        until node -e 'fetch(process.env.OPENID_ISSUER + "/.well-known/openid-configuration").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'; do sleep 3; done
        exec npm run backend
    depends_on:
      meili-${KATIP_SLUG}:
        condition: service_healthy
    env_file:
      - ../../env/tenants/${KATIP_SLUG}.env
    volumes:
      - ../../librechat/rendered/${KATIP_SLUG}.librechat.yaml:/app/librechat.yaml:ro
      - lc-uploads-${KATIP_SLUG}:/app/uploads
      - ../../traefik/dev-certs/localhost.crt:/certs/dev-ca.crt:ro
    networks:
      - tenant
    deploy:
      resources:
        limits:
          memory: ${KATIP_TENANT_MEMORY:-1g}
          cpus: '${KATIP_TENANT_CPUS:-1.0}'
    labels:
      - traefik.enable=true
      - traefik.docker.network=${KATIP_COMPOSE_PROJECT}_t_${KATIP_SLUG}
      - traefik.http.routers.${KATIP_SLUG}.rule=Host(`${KATIP_SLUG}.${KATIP_BASE_DOMAIN}`)
      - traefik.http.routers.${KATIP_SLUG}.entrypoints=websecure
      - traefik.http.routers.${KATIP_SLUG}.tls=true
      - traefik.http.routers.${KATIP_SLUG}.middlewares=${KATIP_SLUG}-ipallow@http,ratelimit-user@file,secure-headers@file
      - traefik.http.services.${KATIP_SLUG}.loadbalancer.server.port=3080
    logging: *default-logging

volumes:
  lc-uploads-${KATIP_SLUG}: {}
  meili-${KATIP_SLUG}: {}

networks:
  # Only this tenant's services, plus Traefik, the gateway and Mongo (LLD-01 §2.3).
  # Not internal: users can add MCP tools, which need the internet.
  tenant:
    name: ${KATIP_COMPOSE_PROJECT}_t_${KATIP_SLUG}
    external: true
