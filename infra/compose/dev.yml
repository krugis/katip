# Dev overrides + AI plane (LLD-01 §2, dev environment). Laptop use only.
# Extends platform.yml: mock provider, self-built LiteLLM (mock-routed config),
# policy-gateway with dev tenants file. LibreChat runs from the rendered tenant
# file (infra/compose/tenants/demo.yml), not here.
name: ${KATIP_COMPOSE_PROJECT:?from katip.config.yaml}

services:
  traefik:
    # dev: dev TLS certs + dashboard on 127.0.0.1:9090 (host)
    ports: !override
      - '80:80'
      - '443:443'
      # dashboard moved to 9090: 8080 often taken by local dev servers
      - '127.0.0.1:9090:8080'
    volumes: !override
      - ../traefik/traefik.dev.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
      - ../traefik/dev-certs:/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt

  postgres:
    # dev: expose on localhost for psql / IDE access while developing.
    ports:
      - '127.0.0.1:5432:5432'

  keycloak:
    environment:
      KC_LOG_LEVEL: INFO
      # One node in dev: skip clustering, which stalls startup looking for peers
      # recorded by the previous container.
      KC_CACHE: local

  mongodb:
    ports:
      - '127.0.0.1:27017:27017'

  valkey:
    ports:
      - '127.0.0.1:6379:6379'

  mailpit:
    ports:
      - '127.0.0.1:8025:8025'

  # ---- AI plane (dev-only services) ----

  mock-llm:
    image: ghcr.io/krugis/mock-llm:dev
    build:
      context: ../..
      dockerfile: apps/mock-llm/Dockerfile
    restart: unless-stopped
    environment:
      PORT: '8080'
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  litellm:
    build:
      context: ../litellm
      args:
        LITELLM_VERSION: ${LITELLM_VERSION:?from katip.config.yaml}
        LITELLM_SHA256: ${LITELLM_SHA256:?from katip.config.yaml}
    image: ghcr.io/krugis/litellm:${LITELLM_VERSION:?from katip.config.yaml}
    restart: unless-stopped
    volumes:
      - ../litellm/rendered/config.dev.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?from katip.env}
      MOCK_LLM_KEY: ${MOCK_LLM_KEY:?from katip.env}
      # Real providers (empty = the model routes to mock-llm, see renderLiteLLMModels)
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GCP_PROJECT: ${GCP_PROJECT:-}
      GCP_VERTEX_KEY: ${GCP_VERTEX_KEY:-}
      VLLM_TR_KEY: ${VLLM_TR_KEY:-}
    entrypoint: ['litellm', '--config', '/app/config.yaml', '--port', '4000']
    depends_on:
      postgres:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python3 -c "import urllib.request;urllib.request.urlopen(''http://127.0.0.1:4000/health/liveliness'')"',
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  policy-gateway:
    image: ghcr.io/krugis/policy-gateway:dev
    build:
      context: ../..
      dockerfile: apps/policy-gateway/Dockerfile
    restart: unless-stopped
    environment:
      PORT: '8080'
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?from katip.env}
      # Not the admin role: katip_gateway is bound by row-level security (LLD-05 §1).
      DATABASE_URL: postgres://katip_gateway:${KATIP_GATEWAY_DB_PASSWORD:?from katip.env}@postgres:5432/governance
      VALKEY_URL: redis://:${VALKEY_PASSWORD:?from katip.env}@valkey:6379
      PRESIDIO_URL: http://presidio-analyzer:3000
      PII_TOKEN_KEY: ${KATIP_PII_TOKEN_KEY:?from katip.env}
      LOG_LEVEL: info
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      litellm:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
    healthcheck:
      # readyz, not healthz: also fails until the governance DB is migrated and seeded
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/readyz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # The console's static files. console-api keeps /api on the same address, by a longer rule.
  console:
    image: ghcr.io/krugis/console:dev
    build:
      context: ../..
      dockerfile: apps/console/Dockerfile
    restart: unless-stopped
    environment:
      KATIP_OIDC_AUTHORITY: https://auth.${KATIP_BASE_DOMAIN:?from katip.config.yaml}/realms/${KATIP_REALM:?from katip.config.yaml}
      KATIP_OIDC_ORIGIN: https://auth.${KATIP_BASE_DOMAIN:?from katip.config.yaml}
      KATIP_BASE_DOMAIN: ${KATIP_BASE_DOMAIN:?from katip.config.yaml}
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=${KATIP_COMPOSE_PROJECT:?from katip.config.yaml}_edge
      - traefik.http.routers.console.rule=Host(`console.${KATIP_BASE_DOMAIN:?from katip.config.yaml}`)
      - traefik.http.routers.console.entrypoints=websecure
      - traefik.http.routers.console.tls=true
      - traefik.http.routers.console.middlewares=secure-headers@file
      - traefik.http.services.console.loadbalancer.server.port=8080
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Holds the Keycloak rights console-api must not (LLD-02 §1). On the backend network only,
  # never behind Traefik.
  identity:
    image: ghcr.io/krugis/provisioner:dev
    build:
      context: ../..
      dockerfile: apps/provisioner/Dockerfile
    restart: unless-stopped
    command: ['node', '/app/provisioner/dist/identity-server.js']
    environment:
      PORT: '8090'
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KATIP_REALM:?from katip.config.yaml}
      KEYCLOAK_CLIENT_ID: katip-provisioner
      KEYCLOAK_CLIENT_SECRET: ${KATIP_PROVISIONER_KC_SECRET:?from katip.env}
      BASE_DOMAIN: ${KATIP_BASE_DOMAIN:?from katip.config.yaml}
      IDENTITY_TOKEN: ${KATIP_IDENTITY_TOKEN:?from katip.env}
    networks:
      - backend
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8090/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  console-api:
    image: ghcr.io/krugis/console-api:dev
    build:
      context: ../..
      dockerfile: apps/console-api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: '8081'
      # Not the admin role: katip_console is bound by row-level security (LLD-05 §1).
      DATABASE_URL: postgres://katip_console:${KATIP_CONSOLE_DB_PASSWORD:?from katip.env}@postgres:5432/governance
      OIDC_ISSUER: https://auth.${KATIP_BASE_DOMAIN:?from katip.config.yaml}/realms/${KATIP_REALM:?from katip.config.yaml}
      OIDC_JWKS_URL: http://keycloak:8080/realms/${KATIP_REALM:?from katip.config.yaml}/protocol/openid-connect/certs
      VALKEY_URL: redis://:${VALKEY_PASSWORD:?from katip.env}@valkey:6379
      IDENTITY_URL: http://identity:8090
      IDENTITY_TOKEN: ${KATIP_IDENTITY_TOKEN:?from katip.env}
      LOG_LEVEL: info
    networks:
      - edge
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      identity:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${KATIP_COMPOSE_PROJECT:?from katip.config.yaml}_edge
      - traefik.http.routers.console-api.rule=Host(`console.${KATIP_BASE_DOMAIN:?from katip.config.yaml}`) && PathPrefix(`/api`)
      - traefik.http.routers.console-api.entrypoints=websecure
      - traefik.http.routers.console-api.tls=true
      - traefik.http.routers.console-api.middlewares=secure-headers@file
      - traefik.http.services.console-api.loadbalancer.server.port=8081
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8081/readyz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  presidio-analyzer:
    # P1-11: Presidio analyzer with multilingual spaCy (TR+EN PERSON NER).
    # No host port: only the policy-gateway talks to it on the backend network.
    image: ghcr.io/krugis/presidio-analyzer:${KATIP_PRESIDIO_VERSION:?from katip.config.yaml}
    build:
      context: ../presidio
      dockerfile: Dockerfile
      args:
        PRESIDIO_REGISTRY: ${KATIP_PRESIDIO_REGISTRY:?from katip.config.yaml}
        PRESIDIO_VERSION: ${KATIP_PRESIDIO_VERSION:?from katip.config.yaml}
        SPACY_MODEL_VERSION: ${KATIP_SPACY_MODEL_VERSION:?from katip.config.yaml}
        SPACY_MODEL_SHA256: ${KATIP_SPACY_MODEL_SHA256:?from katip.config.yaml}
    restart: unless-stopped
    environment:
      PORT: '3000'
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python3 -c "import urllib.request;urllib.request.urlopen(''http://127.0.0.1:3000/health'')"',
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  edge:
    name: ${KATIP_COMPOSE_PROJECT:?from katip.config.yaml}_edge
    external: true
  backend:
    name: ${KATIP_COMPOSE_PROJECT:?from katip.config.yaml}_backend
    external: true
