# Kâtip platform services (LLD-01 §2.1) — one set per environment.
# Only traefik publishes host ports. Everything else is reachable only on the
# internal `edge`/`backend` networks. `dev.yml` adds dev-only overrides and the
# AI plane. Secrets come from infra/env/katip.env; images, names and the domain
# from katip.config.yaml (the bootstrap passes them as environment variables).
name: ${KATIP_COMPOSE_PROJECT:?from katip.config.yaml}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  traefik:
    image: ${KATIP_IMAGE_TRAEFIK:?from katip.config.yaml}
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - edge
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  postgres:
    image: ${KATIP_IMAGE_POSTGRES:?from katip.config.yaml}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-katip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?from katip.env}
      POSTGRES_DB: governance
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?from katip.env}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?from katip.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-katip} -d governance']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging

  keycloak:
    image: ${KATIP_IMAGE_KEYCLOAK:?from katip.config.yaml}
    restart: unless-stopped
    command: ['start', '--http-enabled=true', '--http-port=8080', '--health-enabled=true']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USER:-katip-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?from katip.env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?from katip.env}
      # A full URL, so every link Keycloak writes, such as in invite emails, uses it. Otherwise
      # a link takes its scheme and port from whoever called, and services call it internally.
      KC_HOSTNAME: https://auth.${KATIP_BASE_DOMAIN:?from katip.config.yaml}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true'
    volumes:
      - ../keycloak/themes/katip:/opt/keycloak/themes/katip:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=${KATIP_COMPOSE_PROJECT:?from katip.config.yaml}_edge
      - traefik.http.routers.keycloak.rule=Host(`auth.${KATIP_BASE_DOMAIN:?from katip.config.yaml}`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s
    logging: *default-logging

  mongodb:
    image: ${KATIP_IMAGE_MONGODB:?from katip.config.yaml}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-katip}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?from katip.env}
    volumes:
      - mongodata:/data/db
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' 127.0.0.1/test --quiet | grep -q 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  valkey:
    image: ${KATIP_IMAGE_VALKEY:?from katip.config.yaml}
    restart: unless-stopped
    command:
      [
        'valkey-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${VALKEY_PASSWORD:?from katip.env}',
      ]
    environment:
      # Read by valkey-cli, for the health check.
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?from katip.env}
    volumes:
      - valkey:/data
    networks:
      - backend
    healthcheck:
      # Checks the reply: valkey-cli exits 0 even on an auth error.
      test: ['CMD-SHELL', 'valkey-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging: *default-logging

  mailpit:
    image: ${KATIP_IMAGE_MAILPIT:?from katip.config.yaml}
    restart: unless-stopped
    networks:
      - edge
      - backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=${KATIP_COMPOSE_PROJECT:?from katip.config.yaml}_edge
      - traefik.http.routers.mailpit.rule=Host(`mailpit.${KATIP_BASE_DOMAIN:?from katip.config.yaml}`)
      - traefik.http.routers.mailpit.entrypoints=websecure
      - traefik.http.routers.mailpit.tls=true
      - traefik.http.services.mailpit.loadbalancer.server.port=8025
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8025/']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

networks:
  edge:
    name: ${KATIP_COMPOSE_PROJECT:?from katip.config.yaml}_edge
    external: true
  backend:
    name: ${KATIP_COMPOSE_PROJECT:?from katip.config.yaml}_backend
    external: true

volumes:
  traefik-certs: {}
  pgdata: {}
  mongodata: {}
  valkey: {}
