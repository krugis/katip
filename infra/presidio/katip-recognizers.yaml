# Kâtip recognizer registry (LLD-03 §5): Presidio contributes PERSON NER only
# (the Turkish BERT model in katip-nlp.yaml, read through TransformersRecognizer). Structured TR recognizers
# (TCKN/VKN/IBAN/phone) are TypeScript in packages/pii with checksums; keeping
# them out of Presidio avoids double detection and keeps startup lean.
supported_languages:
  - en
  - tr
global_regex_flags: 26

recognizers:
  - name: TransformersRecognizer
    type: predefined
