# Kâtip NLP engine config (LLD-03 §5): multilingual spaCy for TR + EN PERSON.
nlp_engine_name: spacy
models:
  - lang_code: en
    model_name: xx_ent_wiki_sm
  - lang_code: tr
    model_name: xx_ent_wiki_sm

ner_model_configuration:
  model_to_presidio_entity_mapping:
    PER: PERSON
    PERSON: PERSON
  low_confidence_score_multiplier: 0.4
  low_score_entity_names: []
  labels_to_ignore:
    - ORG
    - ORGANIZATION
    - LOC
    - GPE
    - FAC
    - NORP
    - DATE
    - TIME
    - CARDINAL
    - ORDINAL
    - PERCENT
    - MONEY
    - PRODUCT
    - EVENT
    - LANGUAGE
    - LAW
    - QUANTITY
    - WORK_OF_ART
