# Fluent Bit (P1-43): Docker's fluentd driver → mask → Loki.
# Only containers whose compose service sets the fluentd driver send here (infra/compose/monitoring.yml),
# and redact.lua drops any other tag as well.
[SERVICE]
    Flush         2
    Log_Level     warn
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    Buffer_Max_Size 1M

[FILTER]
    Name          lua
    Match         *
    script        /fluent-bit/etc/katip/redact.lua
    call          katip_redact

[OUTPUT]
    Name          loki
    Match         *
    Host          loki
    Port          3100
    Labels        job=katip
    Label_keys    $service,$stream
    Remove_keys   service,stream
    Drop_single_key raw
    Line_format   key_value
